[package]
name = "gst-plugin-avsynctest"
version.workspace = true
authors = ["Ray Tiley <ray.tiley@trms.com>"]
license = "MPL-2.0"
description = "A/V sync test pattern generation and measurement"
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
gst.workspace = true
gst-base.workspace = true
gst-audio.workspace = true
gst-video.workspace = true

[dev-dependencies]
gst-app.workspace = true

[lib]
name = "gstavsynctest"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[test]]
name = "avsynctestsrc"
path = "tests/avsynctestsrc.rs"

[[test]]
name = "avsyncdetect"
path = "tests/avsyncdetect.rs"

[build-dependencies]
gst-plugin-version-helper.workspace = true

[features]
static = []
capi = []
doc = ["gst/v1_18"]
v1_30 = ["gst/v1_30"]

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gstreamer-base-1.0, gstreamer-audio-1.0, gstreamer-video-1.0, gobject-2.0, glib-2.0, gmodule-2.0"
